<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ControlMaster · Escáner</title>
<style>
:root{
  --bg:#07090d;--bg2:#0d1117;--bg3:#131920;
  --green:#00e87a;--border-g:rgba(0,232,122,0.18);
  --text:#f0f4f8;--text-dim:#7a8a9a;--red:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--bg);border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.top .logo{font-size:14px;font-weight:900;letter-spacing:1px;}
.top .logo span{color:var(--green);}
.top .sep{flex:1;}
.btn-x{width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.1);
  background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;}
.stage{flex:1;position:relative;background:#000;overflow:hidden;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.box{width:82%;max-width:360px;aspect-ratio:1.7/1;position:relative;
  box-shadow:0 0 0 3000px rgba(0,0,0,.42);border-radius:14px;}
.box::before,.box::after,.box i::before,.box i::after{content:"";position:absolute;
  width:28px;height:28px;border:3px solid var(--green);}
.box::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0;}
.box::after{top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 14px 0 0;}
.box i::before{bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 14px;}
.box i::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0;}
.laser{position:absolute;top:50%;left:14%;right:14%;height:2px;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:scan 2s ease-in-out infinite;}
@keyframes scan{0%,100%{transform:translateY(-46px);}50%{transform:translateY(46px);}}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;
  color:#cfeede;text-shadow:0 1px 4px #000;padding:0 16px;}
.btn-torch{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.5);color:#fff;font-size:20px;
  cursor:pointer;display:none;align-items:center;justify-content:center;}
.btn-torch.on{background:var(--green);color:#07090d;border-color:var(--green);}
.feedback{flex-shrink:0;min-height:58px;display:flex;align-items:center;justify-content:center;
  padding:10px 16px;font-size:15px;font-weight:700;text-align:center;background:var(--bg2);
  border-top:1px solid rgba(255,255,255,.07);transition:background .2s;word-break:break-word;}
.feedback.ok{background:rgba(0,232,122,.14);color:var(--green);}
.feedback.err{background:rgba(255,107,107,.14);color:var(--red);}
.bottom{flex-shrink:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);}
.btn-fin{width:100%;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid rgba(255,255,255,.16);
  color:var(--text);font-size:15px;font-weight:800;cursor:pointer;}
.overlay{position:absolute;inset:0;z-index:5;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px;gap:14px;}
.overlay h2{font-size:17px;font-weight:800;}
.overlay p{font-size:14px;color:var(--text-dim);line-height:1.5;max-width:300px;}
.overlay button{margin-top:4px;padding:13px 26px;border:none;border-radius:10px;
  background:var(--green);color:#07090d;font-weight:800;font-size:15px;cursor:pointer;}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">CONTROL<span>MASTER</span></div>
    <div class="sep"></div>
    <button class="btn-x" onclick="cerrar()" title="Cerrar">&#10005;</button>
  </div>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="frame"><div class="box"><i></i></div></div>
    <div class="laser"></div>

    <button class="btn-torch" id="btnTorch" onclick="toggleTorch()" title="Linterna">🔦</button>
    <div class="hint">Pon el código dentro del recuadro, a unos 20 cm, y espera a que enfoque</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">📷 Escáner de productos</h2>
      <p id="ovText">Toca el botón para activar la cámara y empezar a escanear.</p>
      <button id="ovBtn" onclick="iniciar()">Iniciar cámara</button>
    </div>
  </div>

  <div class="feedback" id="feedback">Listo para escanear</div>
  <div class="bottom"><button class="btn-fin" id="btnFin" onclick="cerrar()">✓ Finalizar escaneo</button></div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const AUSENTE_MS=1500, FB_RESET_MS=2200, DETECT_MS=110, ZX_MS=150, ZX_MAX_ANCHO=1280;
let running=false, stream=null, track=null, detector=null, loopId=null, motor="";
let zxReader=null, zxCanvas=null, zxCtx=null, erroresNativo=0;
let lastCode="", lastSeen=0, audioCtx=null, torchOn=false;
let conteo={}, totalAnadidos=0, ultimoEnviado="";
function $(id){return document.getElementById(id);}

function overlay(title,text,btn){
  $("ovTitle").textContent=title; $("ovText").textContent=text||"";
  const b=$("ovBtn");
  if(btn){ b.textContent=btn; b.style.display="inline-block"; } else { b.style.display="none"; }
  $("overlay").style.display="flex";
}
function hideOverlay(){ $("overlay").style.display="none"; }

function unlockAudio(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){}
}
function beep(ok){
  try{ unlockAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type="sine"; o.frequency.value=ok?880:210;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.28,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.18);
    o.start(); o.stop(audioCtx.currentTime+.19);
  }catch(e){}
}
function feedback(txt,cls){ const f=$("feedback"); f.textContent=txt; f.className="feedback"+(cls?" "+cls:""); }
function resetFeedbackSoon(){ clearTimeout(window._fbT); window._fbT=setTimeout(()=>feedback(textoListo()),FB_RESET_MS); }
function textoListo(){
  if(window.opener) return "Listo para escanear";
  const v=$("video");
  return "Modo prueba: cámara activa ✓ (lector "+(motor||"-")+" · "+(v.videoWidth||0)+"×"+(v.videoHeight||0)+")";
}

// Un código detectado: lo manda a Ventas, o (modo prueba) lo muestra en pantalla.
// El mismo código solo vuelve a contar si salió del recuadro al menos AUSENTE_MS
// (antes se volvía a sumar cada 1,5 s si el producto se quedaba frente a la cámara).
function enviarCodigo(code){
  code=String(code||"").trim(); if(!code) return;
  const now=Date.now();
  if(code===lastCode && (now-lastSeen)<AUSENTE_MS){ lastSeen=now; return; }
  lastCode=code; lastSeen=now;
  conteo[code]=(conteo[code]||0)+1;
  ultimoEnviado=code;
  if(conteo[code]>1){ beep(true); setTimeout(()=>beep(true),150); } else beep(true);
  if(window.opener && !window.opener.closed){
    feedback("↑ Enviando "+code+"…");
    try{ window.opener.postMessage({source:"cm-scanner",code:code},"*"); }
    catch(e){ conteo[code]--; feedback("No se pudo enviar a ControlMaster. Cierra el escáner y ábrelo de nuevo desde Ventas.","err"); }
  } else {
    totalAnadidos++;
    avisarAgregado(conteo[code], code+" · modo prueba: abre desde Ventas para cargarlo", true);
  }
}

// Aviso visible de "añadido": destello sobre la cámara + barra de abajo.
// Si es un código repetido, el aviso es naranja, dice cuántas van y suena doble.
function avisarAgregado(n, texto, prueba){
  const rep=n>1;
  const pre = prueba ? (rep?"🔍 Leído otra vez (van "+n+"): ":"🔍 Leído: ")
                     : (rep?"➕ Añadido (en factura: "+n+"): ":"➕ Añadido: ");
  feedback(pre+texto, "ok");
  try{ if(navigator.vibrate) navigator.vibrate(rep?[70,60,70]:40); }catch(e){}
  actualizarBtnFin();
  resetFeedbackSoon();
}
function actualizarBtnFin(){
  $("btnFin").textContent = totalAnadidos ? "✓ Finalizar escaneo ("+totalAnadidos+")" : "✓ Finalizar escaneo";
}

// Respuesta desde Ventas: producto agregado (ok) o no encontrado
window.addEventListener("message",e=>{
  const d=e.data; if(!d || d.source!=="cm-host") return;
  const code=String(d.code||ultimoEnviado||"");
  if(d.ok){
    totalAnadidos++;
    avisarAgregado(Number(d.cant)>0?Number(d.cant):(conteo[code]||1), d.label||code, false);   // cuántas van en la factura
  } else {
    if(conteo[code]) conteo[code]--;
    beep(false); feedback(d.msg ? "⚠️ "+d.msg : "❌ No encontrado: "+code+" — no se añadió a la factura","err");   // encontrado pero no agregado: dice por qué
    resetFeedbackSoon();
  }
});
function handleCamError(err){
  stopAll();
  let msg="No se pudo acceder a la cámara.";
  if(err && (err.name==="NotAllowedError"||err.name==="SecurityError"))
    msg="Permiso de cámara denegado. En iPhone: Ajustes → Safari → Cámara → Permitir, y toca Reintentar.";
  else if(err && err.name==="NotFoundError") msg="No se encontró ninguna cámara en el dispositivo.";
  else if(err && err.name==="NotReadableError") msg="Otra app está usando la cámara. Ciérrala y toca Reintentar.";
  overlay("Cámara no disponible",msg,"Reintentar");
}

// ── LINTERNA ──
function setupTorch(){
  try{
    const caps=track && track.getCapabilities ? track.getCapabilities() : {};
    if(caps && caps.torch){ $("btnTorch").style.display="flex"; }
  }catch(e){}
}
function toggleTorch(){
  if(!track) return;
  torchOn=!torchOn;
  track.applyConstraints({advanced:[{torch:torchOn}]})
    .then(()=>{ $("btnTorch").classList.toggle("on",torchOn); })
    .catch(()=>{ torchOn=!torchOn; });
}

// ── LECTOR NATIVO (Android Chrome y otros) ──
async function crearDetector(){
  if(!("BarcodeDetector" in window)) return null;
  try{
    const sop = await window.BarcodeDetector.getSupportedFormats();
    if(!sop || !sop.length) return null;
    const want=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"].filter(f=>sop.includes(f));
    return new window.BarcodeDetector(want.length?{formats:want}:undefined);
  }catch(e){ return null; }
}
async function loopNativo(){
  if(!running || !detector) return;
  const v=$("video");
  if(v.readyState>=2 && v.videoWidth>0){
    try{
      const found = await detector.detect(v);
      erroresNativo=0;
      if(found && found.length) enviarCodigo(found[0].rawValue);
    }catch(e){
      // Si el lector nativo falla seguido (p. ej. activado a medias en Safari), pasamos a ZXing con la misma cámara
      if(++erroresNativo>=5){ detector=null; iniciarZxing(); return; }
    }
  }
  if(running && detector) loopId=setTimeout(loopNativo,DETECT_MS);
}

// ── RESPALDO ZXing (iPhone / Safari, sin lector nativo) ──
// Usamos la cámara que ya abrimos y leemos solo la zona del recuadro de cada cuadro.
// El tamaño del lienzo se ajusta en cada cuadro (en iPhone el video arranca en 0×0 y luego rota),
// y cualquier error deja el ciclo vivo en vez de detenerlo.
function iniciarZxing(){
  if(typeof ZXing==="undefined"){
    stopAll();
    overlay("Error al cargar","No se pudo cargar el lector de códigos. Revisa tu conexión a internet y toca Reintentar.","Reintentar");
    return false;
  }
  const hints=new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,  ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.ITF,    ZXing.BarcodeFormat.QR_CODE
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  zxReader=new ZXing.MultiFormatReader();
  zxReader.setHints(hints);
  zxCanvas=document.createElement("canvas");
  try{ zxCtx=zxCanvas.getContext("2d",{willReadFrequently:true}); }catch(e){ zxCtx=null; }
  if(!zxCtx) zxCtx=zxCanvas.getContext("2d");
  motor="ZXing";
  loopZxing();
  return true;
}
function loopZxing(){
  if(!running || !zxReader) return;
  const v=$("video"), vw=v.videoWidth, vh=v.videoHeight;
  if(v.readyState>=2 && vw>0 && vh>0){
    try{
      const cw=Math.round(vw*0.9), ch=Math.round(Math.min(vh, cw*0.75));
      const sx=Math.round((vw-cw)/2), sy=Math.round((vh-ch)/2);
      const esc=Math.min(1, ZX_MAX_ANCHO/cw);
      const dw=Math.round(cw*esc), dh=Math.round(ch*esc);
      if(zxCanvas.width!==dw || zxCanvas.height!==dh){ zxCanvas.width=dw; zxCanvas.height=dh; }
      zxCtx.drawImage(v,sx,sy,cw,ch,0,0,dw,dh);
      const lum=new ZXing.HTMLCanvasElementLuminanceSource(zxCanvas);
      const res=zxReader.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)));
      if(res) enviarCodigo(res.getText());
    }catch(e){ /* "no encontrado" es lo normal en la mayoría de cuadros; seguimos */ }
  }
  loopId=setTimeout(loopZxing,ZX_MS);
}

async function iniciar(){
  if(running) return;
  unlockAudio(); hideOverlay(); feedback("Iniciando cámara…");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    overlay("Cámara no disponible","Este navegador no permite usar la cámara. En iPhone abre el enlace directamente en Safari (no dentro de Instagram, WhatsApp u otra app).","Reintentar");
    return;
  }
  // Una sola forma de abrir la cámara para los dos lectores
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} }
    });
  }catch(err){ handleCamError(err); return; }
  const v=$("video");
  v.setAttribute("playsinline",""); v.setAttribute("muted",""); v.muted=true;
  v.srcObject=stream;
  try{ await v.play(); }catch(e){}
  track = stream.getVideoTracks()[0];
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps.focusMode && caps.focusMode.includes("continuous"))
      await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
  }catch(e){}
  setupTorch();
  running=true; erroresNativo=0;

  detector = await crearDetector();
  if(detector){ motor="nativo"; loopNativo(); }
  else if(!iniciarZxing()) return;

  feedback(textoListo());
  setTimeout(()=>{ if(running && $("feedback").className==="feedback") feedback(textoListo()); },1200);
}

function stopAll(){
  running=false;
  clearTimeout(loopId);
  zxReader=null; detector=null; motor="";
  if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream=null; }
  try{ $("video").srcObject=null; }catch(e){}
   track=null; torchOn=false; lastCode="";
  $("btnTorch").classList.remove("on"); $("btnTorch").style.display="none";
}
function cerrar(){
  const n=totalAnadidos, conVentas=!!window.opener;
  stopAll();
  try{ window.close(); }catch(e){}
  // Si el navegador no deja cerrar la pestaña (p. ej. si se abrió a mano), mostramos el resumen
  setTimeout(()=>{
    let txt="";
    if(n) txt = conVentas ? (n===1?"Se añadió 1 producto. ":"Se añadieron "+n+" productos. ")
                          : (n===1?"Se leyó 1 código. ":"Se leyeron "+n+" códigos. ");
    overlay("✓ Escaneo finalizado", txt+"Ya puedes cerrar esta pestaña y volver a Ventas.","Volver a escanear");
    feedback("Escaneo finalizado");
  },300);
}
window.addEventListener("pagehide",stopAll);
// iPhone corta la cámara cuando la pestaña pasa a segundo plano (p. ej. al ir a Ventas y volver)
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible" || !running) return;
  if(!track || track.readyState==="ended"){
    stopAll();
    overlay("📷 Cámara en pausa","La cámara se detuvo al cambiar de pestaña. Toca para reanudar.","Reanudar");
  }
});
</script>
</body>
</html>
